<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>sky-lab</title>
    <style>
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
      canvas { display: block; width: 100%; height: 100%; }
      #mode-buttons {
        position: fixed;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 12px;
        z-index: 10;
        pointer-events: none;
      }
      #mode-buttons button {
        pointer-events: auto;
        min-width: 120px;
        min-height: 48px;
        padding: 12px 20px;
        font-size: 1rem;
        border: none;
        border-radius: 8px;
        background: rgba(255,255,255,0.9);
        color: #333;
        box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        cursor: pointer;
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
      }
      #mode-buttons button:hover { background: #fff; }
      #mode-buttons button:active { transform: scale(0.98); }
    </style>
  </head>
  <body>
    <div id="mode-buttons">
      <button type="button" id="btn-mode" aria-label="モード切替">展開</button>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
